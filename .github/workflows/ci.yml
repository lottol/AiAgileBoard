name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [development]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore AiAgileBoard.slnx
      - run: dotnet build AiAgileBoard.slnx --configuration Release --no-restore
      - run: dotnet test AiAgileBoard.slnx --configuration Release --no-build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/AiAgileBoard.Client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint
      - run: npm test
      - run: npm run build
