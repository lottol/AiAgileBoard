name: Windows desktop
on:
  workflow_dispatch:
  pull_request:
    branches: [development]
  push:
    branches: [main, development]
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build interface
        working-directory: src/AiAgileBoard.Client
        run: |
          npm ci
          npm run build
      - name: Publish desktop
        shell: pwsh
        run: |
          Copy-Item src/AiAgileBoard.Client/dist src/AiAgileBoard.Api/wwwroot -Recurse
          dotnet publish src/AiAgileBoard.Desktop/AiAgileBoard.Desktop.csproj -c Release -r win-x64 --self-contained true -o artifacts/desktop
      - name: Package fixed browser runtime
        shell: pwsh
        run: ./scripts/package-desktop.ps1 -PublishDirectory artifacts/desktop
      - name: Validate packaged app
        shell: powershell
        run: ./scripts/test-desktop.ps1 -Package artifacts/packages/AiAgileBoard-win-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AiAgileBoard-win-x64
          path: artifacts/packages/AiAgileBoard-win-x64.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-validation
          path: |
            artifacts/desktop-test-results/*.json
            artifacts/desktop-test-results/*.txt
